name: Run StockFishV19

on:
  workflow_dispatch:

concurrency:
  group: stockfishv19-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade account to BOT
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_BOT }}
        run: |
          curl -s -d '' "https://lichess.org" -H "Authorization: Bearer $LICHESS_TOKEN"

      - name: Download lichess-bot & Stockfish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone lichess-bot-devs/lichess-bot bot -- --depth 1
          mkdir -p bot/engines/stockfish
          gh release download --repo official-stockfish/Stockfish --pattern "*linux-x86-64*" -O sf.tar
          tar -xf sf.tar -C bot/engines/stockfish --strip-components=1
          find bot/engines/stockfish -type f -name "stockfish*" -exec mv {} bot/engines/stockfish/stockfish-linux-x86-64-universal \;
          chmod +x bot/engines/stockfish/stockfish-linux-x86-64-universal

      - name: Install dependencies & configure
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_BOT }}
        run: |
          cd bot
          pip install -r requirements.txt
          cat << EOF > config.yml
          token: "$LICHESS_TOKEN"
          url: "https://lichess.org/"

          engine:
            dir: "./engines/stockfish/"
            name: "stockfish-linux-x86-64-universal"
            working_dir: ""
            protocol: "uci"
            ponder: true
            polyglot:
              enabled: false
            draw_or_resign:
              resign_enabled: true
              resign_score: -1000
              resign_for_egtb_minus_two: true
              resign_moves: 3
              offer_draw_enabled: true
              offer_draw_score: 0
              offer_draw_for_zero: true
              offer_draw_moves: 10
              offer_draw_pieces: 10
            uci_options:
              Move Overhead: 100
              Threads: 4
              Hash: 2048
            silence_stderr: false

          abort_time: 30
          fake_think_time: false
          rate_limiting_delay: 0
          move_overhead: 2000
          max_takebacks_accepted: 0
          quit_after_all_games_finish: false

          challenge:
            concurrency: 4
            sort_by: "best"
            preference: "none"
            accept_bot: true
            only_bot: false
            max_increment: 180
            min_increment: 0
            max_base: 315360000
            min_base: 0
            max_days: 14
            min_days: 1
            variants:
              - standard
            time_controls:
              - bullet
              - blitz
              - rapid
              - classical
            modes:
              - casual
              - rated
            bullet_requires_increment: false
            max_simultaneous_games_per_user: 4
            games_reserved_for_humans: 1

          greeting:
            hello: "Hi! I'm {me}, running Stockfish 19. Good luck!"
            goodbye: "Good game!"
            hello_spectators: "Hi spectators! I'm {me} running Stockfish 19."
            goodbye_spectators: "Thanks for watching!"

          matchmaking:
            allow_matchmaking: true
            challenge_variant: "standard"
            challenge_timeout: 30
            challenge_initial_time:
              - 60
              - 180
            challenge_increment:
              - 0
              - 1
              - 2
            challenge_mode: "rated"
            delay: 10
          EOF

      - name: Start StockFishV19
        run: |
          cd bot
          python lichess-bot.py
