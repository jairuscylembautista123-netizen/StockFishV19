name: Run StockFishV19

on:
  workflow_dispatch:

concurrency:
  group: stockfishv19-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade account to BOT
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_BOT }}
        run: |
          API_HOST="https://lichess.org"
          curl -s -d '' "$API_HOST/api/bot/account/upgrade" -H "Authorization: Bearer $LICHESS_TOKEN"

      - name: Download lichess-bot & Stockfish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone lichess-bot-devs/lichess-bot bot -- --depth 1
          mkdir -p bot/engines/stockfish
          gh release download --repo official-stockfish/Stockfish --pattern "*linux-x86-64*" -O sf.tar
          tar -xf sf.tar -C bot/engines/stockfish --strip-components=1
          find bot/engines/stockfish -type f -name "stockfish*" -exec mv {} bot/engines/stockfish/stockfish-linux-x86-64-universal \;
          chmod +x bot/engines/stockfish/stockfish-linux-x86-64-universal

      - name: Install dependencies & configure
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_BOT }}
        run: |
          set -e
          cd bot
          pip install -r requirements.txt
          cp config.yml.default config.yml
          python -c '
          import os, yaml
          with open("config.yml", "r") as f:
              cfg = yaml.safe_load(f)
          cfg["token"] = os.environ["LICHESS_TOKEN"]
          cfg["engine"]["dir"] = "./engines/stockfish/"
          cfg["engine"]["name"] = "stockfish-linux-x86-64-universal"
          cfg["engine"]["protocol"] = "uci"
          cfg["engine"]["uci_options"]["Threads"] = 4
          cfg["engine"]["uci_options"]["Hash"] = 2048
          cfg["engine"]["uci_options"]["Move Overhead"] = 100
          cfg["challenge"]["modes"] = ["casual", "rated"]
          cfg["challenge"]["accept_bot"] = True
          cfg["challenge"]["concurrency"] = 4
          cfg["challenge"]["games_reserved_for_humans"] = 1
          cfg["matchmaking"]["allow_matchmaking"] = True
          cfg["matchmaking"]["challenge_variant"] = "standard"
          cfg["matchmaking"]["challenge_timeout"] = 30
          cfg["matchmaking"]["challenge_initial_time"] = [60, 180]
          cfg["matchmaking"]["challenge_increment"] = [0, 1, 2]
          cfg["matchmaking"]["challenge_mode"] = "rated"
          cfg["matchmaking"]["delay"] = 10
          with open("config.yml", "w") as f:
              yaml.dump(cfg, f)
          '
          grep -A 15 "challenge:" config.yml

      - name: Start StockFishV19
        run: |
          cd bot
          python lichess-bot.py
