name: Run StockFishV19

on:
  workflow_dispatch:

concurrency:
  group: stockfishv19-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade account to BOT
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          curl -s -d '' "https://lichess.org" -H "Authorization: Bearer $LICHESS_TOKEN"

      - name: Download lichess-bot, Stockfish 19 & Fairy-Stockfish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone lichess-bot-devs/lichess-bot bot -- --depth 1
          mkdir -p bot/engines

          # 1. Download Normal Stockfish 19 (for Standard & Chess960)
          gh release download --repo official-stockfish/Stockfish --pattern "*linux-x86-64*" -O sf.tar
          mkdir -p sf_tmp
          tar -xf sf.tar -C sf_tmp --strip-components=1
          find sf_tmp -type f -name "stockfish*" -exec mv {} bot/engines/stockfish-19 \;
          chmod +x bot/engines/stockfish-19
          rm -rf sf.tar sf_tmp

          # 2. Download Fairy-Stockfish (exact single Linux binary for Variants)
          gh release download --repo fairy-stockfish/Fairy-Stockfish --pattern "fairy-stockfish-largeboard_x86-64" -O bot/engines/fairy-stockfish
          chmod +x bot/engines/fairy-stockfish

      - name: Install dependencies & configure
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          cd bot
          pip install -r requirements.txt
          cat << EOF > config.yml
          token: "$LICHESS_TOKEN"
          url: "https://lichess.org"

          engine:
            dir: "./engines/"
            name: "stockfish-19"
            working_dir: ""
            protocol: "uci"
            ponder: true
            polyglot:
              enabled: false
            online_moves:
              max_out_of_book_moves: 10
              max_retries: 2
              max_depth: 20
              lichess_cloud_analysis:
                enabled: true
                min_eval_depth: 18
                move_quality: "best"
              lichess_opening_explorer:
                enabled: true
                source: "masters"
                sort: "winrate"
                min_games: 10
              online_egtb:
                enabled: true
                source: "lichess"
                min_time: 10
                max_pieces: 7
                move_quality: "best"
            draw_or_resign:
              resign_enabled: false
              offer_draw_enabled: true
              offer_draw_score: 0
              offer_draw_for_zero: true
              offer_draw_moves: 15
              offer_draw_pieces: 10
            uci_options:
              Move Overhead: 100
              Threads: 4
              Hash: 2048
            silence_stderr: false

          engine_overrides:
            antichess:
              name: "fairy-stockfish"
            atomic:
              name: "fairy-stockfish"
            crazyhouse:
              name: "fairy-stockfish"
            horde:
              name: "fairy-stockfish"
            kingOfTheHill:
              name: "fairy-stockfish"
            racingKings:
              name: "fairy-stockfish"
            threeCheck:
              name: "fairy-stockfish"

          abort_time: 30
          fake_think_time: false
          rate_limiting_delay: 0
          move_overhead: 2000
          max_takebacks_accepted: 0
          quit_after_all_games_finish: false

          challenge:
            concurrency: 4
            sort_by: "best"
            preference: "human"
            accept_bot: true
            only_bot: false
            max_increment: 180
            min_increment: 0
            max_base: 315360000
            min_base: 60
            max_days: 14
            min_days: 1
            variants:
              - standard
              - chess960
              - antichess
              - atomic
              - crazyhouse
              - horde
              - kingOfTheHill
              - racingKings
              - threeCheck
            time_controls:
              - bullet
              - blitz
              - rapid
              - classical
            modes:
              - casual
              - rated
            bullet_requires_increment: false
            max_simultaneous_games_per_user: 2
            games_reserved_for_humans: 1

          greeting:
            hello: "hi."
            goodbye: "gg."
            hello_spectators: "hi."
            goodbye_spectators: "cool."

          matchmaking:
            allow_matchmaking: true
            allow_during_games: false
            challenge_variant: "standard"
            challenge_timeout: 1
            challenge_initial_time:
              - 60
              - 180
              - 300
              - 600
            challenge_increment:
              - 0
              - 2
              - 3
              - 5
            challenge_mode: "rated"
            challenge_filter: "coarse"
            delay: 3
          EOF

      - name: Start StockFishV19
        run: |
          cd bot
          python lichess-bot.py
